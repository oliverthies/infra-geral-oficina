# CI/CD — Infraestrutura Geral (VPC, EKS, ECR, K8s Resources)
#
# AWS Academy: backend S3 costuma ter explicit deny — CI usa state local
# (backend_s3.tf desabilitado). Commite terraform.tfstate após apply local.

name: Terraform - General Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VAR_db_user: ${{ secrets.DB_USER }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_rds_address: ${{ secrets.RDS_ADDRESS }}

permissions:
  contents: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init (state local no CI — Learner Lab)
        run: |
          if [ -f backend_s3.tf ]; then
            mv backend_s3.tf backend_s3.ci-disabled
          fi
          rm -rf .terraform
          terraform init -input=false -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init (state local no CI — Learner Lab)
        run: |
          if [ -f backend_s3.tf ]; then
            mv backend_s3.tf backend_s3.ci-disabled
          fi
          rm -rf .terraform
          terraform init -input=false -reconfigure

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Commitar state atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform.tfstate || true
          git diff --cached --quiet || git commit -m "chore: atualizar terraform state [skip ci]"
          git push || true
